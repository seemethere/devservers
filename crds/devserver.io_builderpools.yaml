apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: builderpools.devserver.io
spec:
  group: devserver.io
  names:
    kind: BuilderPool
    listKind: BuilderPoolList
    plural: builderpools
    singular: builderpool
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  description: Number of BuildKit daemon replicas
                  default: 1
                  minimum: 1
                image:
                  type: string
                  description: BuildKit daemon image
                  default: moby/buildkit:latest
                resources:
                  type: object
                  description: Resource requirements for BuildKit daemon pods
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                nodeSelector:
                  type: object
                  description: Node selector for BuildKit daemon pods
                  x-kubernetes-preserve-unknown-fields: true
                tolerations:
                  type: array
                  description: Tolerations for BuildKit daemon pods
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      operator:
                        type: string
                      value:
                        type: string
                      effect:
                        type: string
                      tolerationSeconds:
                        type: integer
                cache:
                  type: object
                  description: Cache configuration for BuildKit
                  properties:
                    type:
                      type: string
                      enum: [registry, local, s3]
                      default: registry
                    registry:
                      type: string
                      description: Registry URL for cache storage
                    s3:
                      type: object
                      description: S3 cache configuration
                      properties:
                        bucket:
                          type: string
                        region:
                          type: string
                        endpoint:
                          type: string
                gcPolicy:
                  type: object
                  description: Garbage collection policy for build cache
                  properties:
                    keepBytes:
                      type: string
                      description: Maximum cache size to keep (e.g., 50Gi)
                    keepDuration:
                      type: string
                      description: Maximum age of cache entries (e.g., 168h)
                rootless:
                  type: boolean
                  description: Run BuildKit in rootless mode for security
                  default: true
                registrySecrets:
                  type: array
                  description: Secrets containing registry credentials
                  items:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Ready, Degraded, Failed]
                readyReplicas:
                  type: integer
                message:
                  type: string
                endpoint:
                  type: string
                  description: Internal service endpoint for BuildKit daemon
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
